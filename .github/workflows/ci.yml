name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels the in-flight run for that PR. Runs on main are
# never cancelled — release.yml keys off them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 22, so test the floor and current.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node --test test/*.test.js

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Deliberately no separate build step: `prepack` is what has to produce
      # `dist`, and building here first would pass even if it did not. That is
      # the exact way this job passed while `npm pack` shipped three files and
      # no entry points at all.
      - run: npm ci --ignore-scripts

      # Catches a tarball that is missing dist/, ships node_modules, or has a
      # broken bin path — all of which only surface after a bad publish.
      - name: Inspect publish tarball
        run: npm pack --dry-run

      - name: Verify the CLI runs from a clean install
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          tarball=$(ls /tmp/slimdoc-*.tgz)
          mkdir /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install "$tarball"
          printf 'hello    world\n\n\n\nsecond   line\n' > sample.md
          ./node_modules/.bin/slimdoc sample.md
          node --input-type=module -e "
            import { strict as assert } from 'node:assert';
            const { clean, extractFromFile, cleanDocument } = await import('slimdoc');
            for (const [name, fn] of Object.entries({ clean, extractFromFile, cleanDocument })) {
              assert.equal(typeof fn, 'function', \`missing export: \${name}\`);
            }
            assert.match(clean('a    b\n\n\n\nc'), /a b/);
            console.log('package entry point OK');
          "

  # Merging a PR that does not touch package.json's version is a silent no-op in
  # release.yml: the check job passes, the publish job is skipped, and nothing
  # says so until someone goes looking for the missing release. This job answers
  # "will merging this publish?" on the PR itself.
  #
  # The registry comparison is deliberately identical to release.yml's, so a
  # green preview and a skipped publish can never disagree. It never fails the
  # build; not releasing is a normal outcome for most PRs.
  release-preview:
    name: release preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Report what merging this PR would publish
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::notice title=No release::package.json is still at $version, which is already on npm. Merging this PR will not publish."
            {
              echo "### No release"
              echo
              echo "\`package.json\` is at **$version**, which npm already has."
              echo "Merging this PR publishes nothing, and npmjs.com keeps showing the README and files from the current release."
              echo
              echo "Bump the version in a PR to main when you want these changes on npm."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # release.yml hard-fails on this rather than publishing, so surface it
          # here while it is still cheap to fix.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "::error title=Release will fail::$tag already exists as a git tag but $version is not on npm. release.yml will fail on merge."
            {
              echo "### Release will fail"
              echo
              echo "Tag \`$tag\` exists, but **$version** is not on npm."
              echo "\`release.yml\` treats that as a failed earlier release and refuses to publish. Delete the tag or bump to the next version."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::notice title=Will publish $version::Merging this PR publishes $name@$version to npm and tags $tag."
          {
            echo "### Will publish $version"
            echo
            echo "Merging this PR publishes **$name@$version** to npm, tags \`$tag\`, and opens a GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
